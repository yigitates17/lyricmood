name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The embeddings extra (onnxruntime, LanceDB) is installed so vector code
      # is tested; the model itself is never downloaded in CI.
      - run: uv sync --locked --extra embeddings
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Tests use recorded fixtures only; no API keys or network needed.
      - run: uv run pytest -q
