[project]
name = "lyricmood"
version = "0.1.0"
description = "A lyrics-aware personal music assistant: MCP server + terminal chat over Spotify, LRCLIB, Last.fm, ReccoBeats and YouTube."
readme = "README.md"
authors = [
    { name = "Yigit Ates" }
]
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "rich>=15.0.0",
    "spotipy>=2.26.0",
    "tenacity>=9.2.1",
    "typer>=0.27.3",
]

[project.scripts]
lyricmood = "lyricmood.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lyricmood"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
